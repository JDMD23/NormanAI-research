name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install pytest
      - name: Run tests
        run: python3 -m pytest tests/ -q
      - name: Check configs parse
        run: |
          python3 -c "
          import json, pathlib, sys
          for p in sorted(pathlib.Path('config').glob('*.json')):
              json.loads(p.read_text())
              print('ok', p)
          "

  cross-repository-acceptance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NORMAN_REQUIRE_CROSS_REPO: "1"
      NORMAN_CRM_CORE_ACCEPTANCE_PATH: ${{ github.workspace }}/core
    steps:
      - name: Check out Research
        uses: actions/checkout@v4
        with:
          path: research
      - name: Read pinned Core commit
        id: core-pin
        working-directory: research
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          payload = json.loads(
              Path("config/core-compatibility.json").read_text()
          )
          print(f"sha={payload['commit']}")
          PY
      - name: Check out pinned Core
        uses: actions/checkout@v4
        with:
          repository: JDMD23/NormanAI-crm-core
          ref: ${{ steps.core-pin.outputs.sha }}
          ssh-key: ${{ secrets.CRM_CORE_READONLY_DEPLOY_KEY }}
          path: core
          fetch-depth: 0
          persist-credentials: false
      - name: Prove pinned Core commit is merged
        working-directory: core
        run: |
          git fetch origin main
          git merge-base --is-ancestor \
            "${{ steps.core-pin.outputs.sha }}" origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install pytest
      - name: Run mandatory cross-repository contract
        working-directory: research
        run: |
          python3 -m pytest tests/test_cross_repo_coordination.py \
            --junitxml=cross-repo-results.xml -q
      - name: Prove all acceptance cases ran
        working-directory: research
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("cross-repo-results.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          totals = {
              name: sum(int(suite.attrib.get(name, 0)) for suite in suites)
              for name in ("tests", "failures", "errors", "skipped")
          }
          assert totals == {
              "tests": 10,
              "failures": 0,
              "errors": 0,
              "skipped": 0,
          }, totals
          PY
