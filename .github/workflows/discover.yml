name: Daily discovery

# The search half of the daily run. No browser here — Crunchbase and Substack
# need JD's logged-in Chrome, so those lanes are skipped automatically and the
# full run lives on the Mac (see docs/scheduling.md).
#
# CI does NOT promote. It produces the brief and the CSV as artifacts, which
# makes it a free canary: if the candidates look wrong, the board is untouched.

on:
  schedule:
    # 06:30 and 13:00 ET → UTC-4 (EDT). Fixed-UTC cron shifts an hour under
    # EST; acceptable for a discovery sweep, don't add a second schedule.
    - cron: "30 10 * * 1-5"
    - cron: "0 17 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no CSV, nothing marked as sent)"
        type: boolean
        default: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The seen-store is what stops the same company being handed over twice.
      # Without it every scheduled run re-emits the same companies.
      - name: Restore seen-store
        uses: actions/cache@v4
        with:
          path: state/
          key: research-state-${{ github.run_id }}
          restore-keys: research-state-

      - name: Probe the xAI API
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python3 scripts/research_probe.py

      - name: Daily run (search lanes only)
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/daily.py --no-browser --dry-run
          else
            python3 scripts/daily.py --no-browser --write --yes
          fi

      - name: Upload brief and intake CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-brief
          path: |
            out/
            state/latest-run.json
          if-no-files-found: ignore
          retention-days: 30
